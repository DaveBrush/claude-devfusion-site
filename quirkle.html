<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quirkle Score Tracker</title>
<link rel="icon" type="image/png" href="favicon.png" />
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 300 600;
    font-display: swap;
    src: url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 300 600;
    font-display: swap;
    src: url('fonts/inter-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Devfusion theme ── */
  :root {
    --ink: #0f1117;
    --ink-mid: #3a3d47;
    --ink-muted: #7a7f8e;
    --surface: #fff;
    --surface-2: #f8f8f7;
    --surface-dark: #0f1117;
    --accent: #ff6600;
    --accent-hover: #e55a00;
    --accent-light: #fff3eb;
    --border: #e8e8e6;
    --radius: 6px;
    --radius-lg: 12px;
    --max: 800px;
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* ── Quirkle theme ── */
  body.quirkle-theme {
    --ink: #f0eeff;
    --ink-mid: rgba(240,238,255,0.8);
    --ink-muted: rgba(240,238,255,0.45);
    --surface: #1e1540;
    --surface-2: #150e30;
    --surface-dark: #0d0820;
    --accent: #f8c200;
    --accent-hover: #e0af00;
    --accent-light: rgba(248,194,0,0.12);
    --border: rgba(255,255,255,0.1);
    --q-red: #e63329;
    --q-orange: #f47920;
    --q-yellow: #f8c200;
    --q-green: #009640;
    --q-blue: #005bac;
    --q-purple: #7b2d8b;
  }

  body {
    background: var(--surface-2);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface-dark);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.25s;
    flex-shrink: 0;
  }

  .quirkle-theme header {
    background: #0d0820;
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg,
      var(--q-red), var(--q-orange), var(--q-yellow),
      var(--q-green), var(--q-blue), var(--q-purple)) 1;
  }

  header h1 {
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  header h1 span { color: var(--accent); }

  .tile-row { display: none; gap: 3px; }
  .quirkle-theme .tile-row { display: flex; }

  .tile { width: 12px; height: 12px; border-radius: 2px; }
  .t-r { background: var(--q-red); }
  .t-o { background: var(--q-orange); }
  .t-y { background: var(--q-yellow); }
  .t-g { background: var(--q-green); }
  .t-b { background: var(--q-blue); }
  .t-p { background: var(--q-purple); }

  /* ── Burger ── */
  .burger {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    width: 34px;
    height: 34px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    transition: border-color 0.15s;
  }

  .burger:hover { border-color: rgba(255,255,255,0.5); }
  .quirkle-theme .burger { border-color: rgba(248,194,0,0.35); color: var(--q-yellow); }
  .quirkle-theme .burger:hover { border-color: var(--q-yellow); }

  .burger span {
    display: block;
    width: 15px;
    height: 2px;
    background: currentColor;
    border-radius: 2px;
    transition: transform 0.2s, opacity 0.2s;
  }

  .burger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  .menu-wrap { position: relative; }

  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #1c1c24;
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-lg);
    min-width: 190px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    overflow: hidden;
    z-index: 100;
  }

  .quirkle-theme .dropdown {
    background: #150e30;
    border-color: rgba(248,194,0,0.2);
  }

  .dropdown.open { display: block; }

  .dropdown button {
    display: block;
    width: 100%;
    padding: 0.7rem 1rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.8);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }

  .dropdown button:last-child { border-bottom: none; }
  .dropdown button:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .quirkle-theme .dropdown button:hover { background: rgba(248,194,0,0.08); color: var(--q-yellow); }
  .dropdown button.danger:hover { background: rgba(220,38,38,0.12); color: #f87171; }
  .dropdown button:disabled { opacity: 0.35; cursor: default; }
  .dropdown button:disabled:hover { background: transparent; color: rgba(255,255,255,0.8); }

  /* ── Main ── */
  main {
    padding: 0.75rem 0.75rem 2.5rem;
    max-width: var(--max);
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* ── Player grid ── */
  .players {
    display: grid;
    gap: 0.6rem;
    grid-template-columns: 1fr;
    align-items: start;
  }

  /* 3–4 players: 2-column grid, scrolls naturally */
  .players.count-3,
  .players.count-4 { grid-template-columns: 1fr 1fr; }

  /* ── Player card ── */
  .player-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.75rem 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: border-color 0.2s, background 0.25s, box-shadow 0.2s;
    min-width: 0;
    overflow: hidden;
  }

  .player-card.leading {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  .quirkle-theme .player-card.leading {
    border-color: var(--q-yellow);
    box-shadow: 0 0 0 3px rgba(248,194,0,0.12), 0 0 20px rgba(248,194,0,0.07);
  }

  /* ── Name row ── */
  .name-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .player-number {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }

  .player-card.leading .player-number {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .name-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    min-width: 0;
  }

  .name-input::placeholder { color: var(--ink-muted); font-weight: 400; }

  .remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-muted);
    font-size: 1rem;
    line-height: 1;
    padding: 0 0 0 0.2rem;
    display: none;
    transition: color 0.12s;
  }

  .remove-btn:hover { color: #dc2626; }
  .players.count-3 .remove-btn,
  .players.count-4 .remove-btn { display: block; }

  /* ── Score ── */
  .score-display {
    text-align: center;
    font-weight: 600;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.03em;
    padding: 0.6rem 0;
    /* Big by default for 1–2 players */
    font-size: clamp(4.5rem, 18vw, 7rem);
    transition: color 0.2s;
  }

  /* 3–4 players: half-width cards, scale score proportionally but keep it prominent */
  .players.count-3 .score-display,
  .players.count-4 .score-display {
    font-size: clamp(2.5rem, 11vw, 4rem);
    padding: 0.4rem 0;
  }

  .player-card.leading .score-display { color: var(--accent); }

  /* ── Turn adjuster ── */
  .turn-section { display: flex; flex-direction: column; gap: 0.35rem; }

  .turn-label {
    font-size: 0.6rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    text-align: center;
  }

  /* Hide label only when cards are very narrow (3–4 player half-width) */
  .players.count-3 .turn-label,
  .players.count-4 .turn-label { font-size: 0.55rem; }

  .turn-adjuster {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  .adj-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
    flex-shrink: 0;
    font-family: inherit;
  }

  .adj-btn:hover { background: var(--border); }
  .adj-btn:active { background: var(--ink-muted); color: #fff; }

  .turn-value {
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--ink);
    min-width: 2.5ch;
    text-align: center;
    letter-spacing: -0.02em;
  }

  /* ── Action buttons ── */
  .action-btns {
    display: flex;
    gap: 0.4rem;
  }

  /* Always stack buttons vertically — matches 2-player style */
  .action-btns { flex-direction: column; }

  .add-btn {
    flex: 1;
    padding: 0.45rem 0.3rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s;
    white-space: nowrap;
  }

  .add-btn:hover { background: var(--border); }

  .quirkle-btn {
    flex: 1;
    padding: 0.45rem 0.3rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.12s, transform 0.08s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
  }

  .quirkle-btn:hover { background: var(--accent-hover); }
  .quirkle-btn:active { transform: scale(0.97); }

  .quirkle-theme .quirkle-btn {
    background: linear-gradient(90deg,
      var(--q-red), var(--q-orange), var(--q-yellow),
      var(--q-green), var(--q-blue), var(--q-purple));
  }

  .quirkle-theme .quirkle-btn:hover { filter: brightness(1.12); }

  .bonus-tag {
    font-size: 0.62rem;
    font-weight: 500;
    opacity: 0.85;
    background: rgba(0,0,0,0.18);
    border-radius: 3px;
    padding: 0.05rem 0.25rem;
  }

  /* Hide bonus tag text in half-width cards — button label is enough */
  .players.count-3 .bonus-tag,
  .players.count-4 .bonus-tag { display: none; }

  /* ── Add player bar ── */
  .add-player-bar {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  .add-player-btn {
    background: transparent;
    border: 1.5px dashed var(--border);
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.45rem 1.25rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .add-player-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-player-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* ── History bottom sheet ── */
  .history-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: var(--max);
    margin: 0 auto;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
    transition: background 0.25s, border-color 0.25s;
    z-index: 50;
  }

  .quirkle-theme .history-sheet {
    box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
  }

  .history-toggle {
    width: 100%;
    background: none;
    border: none;
    padding: 0.65rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 1.5px solid transparent;
    transition: border-color 0.2s;
  }

  .history-sheet.open .history-toggle {
    border-bottom-color: var(--border);
  }

  .history-toggle-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    flex: 1;
    text-align: left;
  }

  .history-actions {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }

  .history-chevron {
    display: block;
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    transition: transform 0.25s ease;
  }

  .history-sheet.open .history-chevron {
    transform: rotate(180deg);
  }

  .history-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }

  .history-sheet.open .history-body {
    max-height: 45dvh;
  }

  .history-list {
    list-style: none;
    max-height: calc(45dvh - 3rem);
    overflow-y: auto;
  }

  .history-list:empty::after {
    content: 'No turns yet';
    display: block;
    text-align: center;
    padding: 1rem;
    color: var(--ink-muted);
    font-size: 0.82rem;
  }

  .history-item {
    display: flex;
    align-items: center;
    padding: 0.45rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    gap: 0.65rem;
    animation: slide-in 0.15s ease;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .history-item:last-child { border-bottom: none; }
  .history-turn { color: var(--ink-muted); font-size: 0.72rem; min-width: 2ch; }
  .history-name { flex: 1; font-weight: 500; color: var(--ink-mid); }
  .history-points { font-weight: 600; }
  .history-points.positive { color: #16a34a; }
  .quirkle-theme .history-points.positive { color: #4ade80; }

  .history-badge {
    font-size: 0.62rem;
    font-weight: 600;
    background: var(--accent);
    color: #000;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .quirkle-theme .history-badge {
    background: linear-gradient(90deg, var(--q-red), var(--q-purple));
    color: #fff;
  }

  .undo-link {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.72rem;
    color: var(--ink-muted);
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .undo-link:hover { color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>
    Quirkle <span>Scorer</span>
    <div class="tile-row" aria-hidden="true">
      <div class="tile t-r"></div><div class="tile t-o"></div>
      <div class="tile t-y"></div><div class="tile t-g"></div>
      <div class="tile t-b"></div><div class="tile t-p"></div>
    </div>
  </h1>
  <div class="menu-wrap">
    <button class="burger" id="burger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="dropdown" id="dropdown">
      <button id="theme-toggle" onclick="toggleTheme(); closeMenu()">Switch to Quirkle theme</button>
      <button class="danger" onclick="resetGame(); closeMenu()">New Game</button>
    </div>
  </div>
</header>

<main>
  <div class="players count-2" id="players"></div>

  <div class="add-player-bar" id="add-player-bar">
    <button class="add-player-btn" id="add-player-btn" onclick="addPlayer()">+ Add player</button>
  </div>
</main>

<div class="history-sheet" id="history-sheet">
  <button class="history-toggle" onclick="toggleHistory()" aria-expanded="false" id="history-toggle-btn">
    <svg class="history-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="3 6 8 11 13 6"/>
    </svg>
    <span class="history-toggle-label">Turn history</span>
  </button>
  <div class="history-body">
    <div class="history-actions">
      <button class="undo-link" onclick="undoLast()">Undo last</button>
    </div>
    <ul class="history-list" id="history-list"></ul>
  </div>
</div>

<script>
  // ── State ──
  let playerCount = 2;
  const MAX_PLAYERS = 4;
  const scores = [0, 0, 0, 0];
  const turns  = [0, 0, 0, 0];
  const log = [];
  let turnCount = 0;

  // ── Render players ──
  function renderPlayers() {
    const grid = document.getElementById('players');
    grid.className = 'players count-' + playerCount;
    grid.innerHTML = '';

    for (let i = 0; i < playerCount; i++) {
      const card = document.createElement('div');
      card.className = 'player-card';
      card.id = 'card-' + i;
      card.innerHTML = `
        <div class="name-row">
          <div class="player-number">${i + 1}</div>
          <input class="name-input" id="name-${i}" type="text"
            placeholder="Player ${i + 1}" autocomplete="off" />
          <button class="remove-btn" onclick="removePlayer(${i})" aria-label="Remove player">×</button>
        </div>
        <div class="score-display" id="score-${i}">${scores[i]}</div>
        <div class="turn-section">
          <div class="turn-label">Points this turn</div>
          <div class="turn-adjuster">
            <button class="adj-btn" onclick="adjustTurn(${i}, -1)" aria-label="Decrease">−</button>
            <span class="turn-value" id="turn-${i}">${turns[i]}</span>
            <button class="adj-btn" onclick="adjustTurn(${i}, 1)" aria-label="Increase">+</button>
          </div>
        </div>
        <div class="action-btns">
          <button class="add-btn" onclick="addScore(${i}, false)">Add</button>
          <button class="quirkle-btn" onclick="addScore(${i}, true)">
            QUIRKLE! <span class="bonus-tag">+6</span>
          </button>
        </div>`;
      grid.appendChild(card);
    }

    updateLeader();
    document.getElementById('add-player-bar').style.display = playerCount >= MAX_PLAYERS ? 'none' : 'flex';
  }

  function addPlayer() {
    if (playerCount >= MAX_PLAYERS) return;
    playerCount++;
    renderPlayers();
  }

  function removePlayer(index) {
    if (playerCount <= 2) return;
    scores.splice(index, 1); scores.push(0);
    turns.splice(index, 1);  turns.push(0);
    playerCount--;
    renderPlayers();
  }

  // ── Scoring ──
  function getPlayerName(i) {
    const el = document.getElementById('name-' + i);
    return (el && el.value.trim()) || ('Player ' + (i + 1));
  }

  function adjustTurn(player, delta) {
    turns[player] = Math.max(0, turns[player] + delta);
    document.getElementById('turn-' + player).textContent = turns[player];
  }

  function addScore(player, isQuirkle) {
    const points = turns[player] + (isQuirkle ? 6 : 0);
    if (points === 0 && !isQuirkle) return;

    scores[player] += points;
    turnCount++;
    log.push({ player, points, isQuirkle, turn: turnCount });
    turns[player] = 0;

    document.getElementById('turn-' + player).textContent = '0';
    document.getElementById('score-' + player).textContent = scores[player];
    updateLeader();
    addHistoryItem(log[log.length - 1]);
  }

  function updateLeader() {
    const max = Math.max(...scores.slice(0, playerCount));
    for (let i = 0; i < playerCount; i++) {
      const card = document.getElementById('card-' + i);
      if (card) card.classList.toggle('leading', scores[i] === max && max > 0);
    }
  }

  function addHistoryItem(entry) {
    const list = document.getElementById('history-list');
    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerHTML =
      '<span class="history-turn">' + entry.turn + '</span>' +
      '<span class="history-name">' + getPlayerName(entry.player) + '</span>' +
      (entry.isQuirkle ? '<span class="history-badge">Quirkle!</span>' : '') +
      '<span class="history-points positive">+' + entry.points + '</span>';
    list.prepend(li);
  }

  function undoLast() {
    if (log.length === 0) return;
    const entry = log.pop();
    scores[entry.player] -= entry.points;
    turnCount--;
    const el = document.getElementById('score-' + entry.player);
    if (el) el.textContent = scores[entry.player];
    updateLeader();
    const items = document.getElementById('history-list').querySelectorAll('.history-item');
    if (items.length > 0) items[0].remove();
  }

  function resetGame() {
    if (log.length > 0 && !confirm('Start a new game? All scores will be reset.')) return;
    scores.fill(0); turns.fill(0);
    turnCount = 0; log.length = 0;
    document.getElementById('history-list').innerHTML = '';
    renderPlayers();
  }

  // ── History sheet ──
  function toggleHistory() {
    const sheet = document.getElementById('history-sheet');
    const btn = document.getElementById('history-toggle-btn');
    const open = sheet.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  }

  // ── Menu ──
  const burgerEl = document.getElementById('burger');
  const dropdownEl = document.getElementById('dropdown');

  function toggleMenu() {
    const open = dropdownEl.classList.toggle('open');
    burgerEl.classList.toggle('open', open);
  }

  function closeMenu() {
    dropdownEl.classList.remove('open');
    burgerEl.classList.remove('open');
  }

  document.addEventListener('click', e => {
    if (!burgerEl.contains(e.target) && !dropdownEl.contains(e.target)) closeMenu();
  });

  // ── Theme ──
  const THEME_KEY = 'quirkle-theme';
  const themeBtn = document.getElementById('theme-toggle');

  function applyTheme(isQuirkle) {
    document.body.classList.toggle('quirkle-theme', isQuirkle);
    themeBtn.textContent = isQuirkle ? 'Switch to Devfusion theme' : 'Switch to Quirkle theme';
    localStorage.setItem(THEME_KEY, isQuirkle ? '1' : '0');
  }

  function toggleTheme() {
    applyTheme(!document.body.classList.contains('quirkle-theme'));
  }

  if (localStorage.getItem(THEME_KEY) === '1') applyTheme(true);

  // ── Init ──
  renderPlayers();
</script>
</body>
</html>
